<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Indigo MFA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/cosmo/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { width: 100%; max-width: 450px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,.1); border-radius: 12px; }
    </style>
</head>
<body>

<div class="card p-4">
    <div class="text-center mb-4">
        <h3 class="text-primary"><i class="fas fa-shield-alt"></i> Indigo MFA</h3>
        <p class="text-muted">Self-Service Enrollment</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="text-center">
        <div class="alert alert-success">Registration Started for <strong>{{ email }}</strong>!</div>
        <p>Scan this code with your Indigo App:</p>
        <img src="{{ qr_image }}" class="img-fluid border p-2 mb-3">
        <p class="small text-muted">Or enter this code manually:</p>
        <div class="input-group mb-3">
            <input type="text" class="form-control form-control-sm" value="{{ smart_code }}" readonly id="smart-code">
            <button class="btn btn-outline-secondary btn-sm" onclick="copyCode()">Copy</button>
        </div>
        <a href="/register-user" class="btn btn-link">Start Over</a>
    </div>
    {% else %}
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" required placeholder="name@company.com">
        </div>
        <!-- SSO Placeholder -->
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Continue with Email</button>
            <div class="text-center text-muted small my-2">- OR -</div>
            <button type="button" class="btn btn-outline-danger" onclick="alert('SSO Config Required')">
                <i class="fab fa-google me-2"></i>Sign in with Google
            </button>
            <button type="button" class="btn btn-outline-primary" onclick="alert('SSO Config Required')">
                <i class="fab fa-microsoft me-2"></i>Log in with Company SSO
            </button>
        </div>
    </form>
    {% endif %}
</div>

<script>
    function copyCode() {
        var copyText = document.getElementById("smart-code");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
    }
</script>

</body>
</html>
