<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card-metric { text-align: center; padding: 20px; }
        .metric-value { font-size: 2.5rem; font-weight: bold; }
        .success { color: #198754; }
        .fail { color: #dc3545; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Decentralized MFA Monitor</span>
    </div>
</nav>

<div class="container mt-4">
    <!-- Metrics Row -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card card-metric shadow-sm">
                <h5>Registered Users</h5>
                <div class="metric-value text-primary" id="total-users">-</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-metric shadow-sm">
                <h5>Auth Success</h5>
                <div class="metric-value success" id="auth-success">-</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card card-metric shadow-sm">
                <h5>Auth Fails</h5>
                <div class="metric-value fail" id="auth-fail">-</div>
            </div>
        </div>
    </div>

    <!-- Chart & Logs Row -->
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title">Authentication Health</h5>
                <canvas id="authChart"></canvas>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="card-title">Recent Activity Logs</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-sm text-nowrap">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Event</th>
                                <th>User</th>
                                <th>Status</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body">
                            <!-- Logs injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let authChartInstance = null;

    async function fetchData() {
        try {
            const response = await fetch('/api/stats');
            const data = await response.json();

            // Update Counters
            document.getElementById('total-users').innerText = data.total_users;
            document.getElementById('auth-success').innerText = data.auth_stats[0];
            document.getElementById('auth-fail').innerText = data.auth_stats[1];

            // Update Chart
            updateChart(data.auth_stats[0], data.auth_stats[1]);

            // Update Logs
            const logsBody = document.getElementById('logs-table-body');
            logsBody.innerHTML = '';
            data.logs.forEach(log => {
                const row = `<tr>
                    <td>${log.timestamp}</td>
                    <td><span class="badge bg-secondary">${log.event}</span></td>
                    <td>${log.user}</td>
                    <td><span class="badge ${log.status === 'SUCCESS' ? 'bg-success' : 'bg-danger'}">${log.status}</span></td>
                    <td>${log.details}</td>
                </tr>`;
                logsBody.innerHTML += row;
            });

        } catch (error) {
            console.error('Error fetching stats:', error);
        }
    }

    function updateChart(success, fail) {
        const ctx = document.getElementById('authChart').getContext('2d');
        if (authChartInstance) {
            authChartInstance.destroy();
        }
        authChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Success', 'Fail'],
                datasets: [{
                    data: [success, fail],
                    backgroundColor: ['#198754', '#dc3545']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }

    // Refresh every 5 seconds
    fetchData();
    setInterval(fetchData, 5000);
</script>

</body>
</html>
